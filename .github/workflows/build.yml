name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # The embedded addon's `## Version:` is stamped from CLASSICAPI_TAG
      # at embed time (see cmake/embed_addon.cmake) — no source edit here.

      - name: Configure (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        run: cmake -B build -A Win32 "-DCLASSICAPI_TAG=${{ github.ref_name }}"

      - name: Configure (branch)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        run: cmake -B build -A Win32

      - name: Build
        run: cmake --build build --config Release

      - name: Upload artifact
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@v4
        with:
          name: ClassicAPI-${{ github.sha }}
          path: build/Release/ClassicAPI.dll

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/Release/ClassicAPI.dll
          generate_release_notes: true
